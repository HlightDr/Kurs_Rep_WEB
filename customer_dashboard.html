<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал обслуживания промышленных регистраторов</title>
    <link rel="stylesheet" href="css/customer_dashboard.css">
</head>
<body>
    <div id="preloader" class="preloader hidden">
    <div class="spinner"></div>
</div>
    <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </symbol>
        <symbol id="icon-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </symbol>
        <symbol id="icon-check-circle-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 12 16 16 8"/>
        </symbol>
        <symbol id="icon-message-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </symbol>
    </svg>

    <div class="admin-btn-container">
        <button id="gotoAdminBtn" class="admin-btn">Админ-панель</button>
    </div>

    <main class="main">
        <div class="container">
            <div class="new-repair-wrapper">
                <button class="btn-primary">
                    <svg class="icon"><use href="#icon-plus"/></svg>
                    <span>Новая заявка на ремонт</span>
                </button>
            </div>

            <div class="dashboard-grid">
                <div class="space-y-3">
                    <div class="card">
                        <h2 class="card-title" id="recordersLink">Мои зарегистрированные регистраторы</h2>
                        <div class="recorder-list"></div>
                    </div>

                    <div class="card">
                        <h2 class="card-title">Последний завершённый ремонт</h2>
                        <div class="repair-completed">
                            <div class="repair-header">
                                <div class="repair-icon-green">
                                    <svg class="icon"><use href="#icon-check-circle-2"/></svg>
                                </div>
                                <div class="repair-details">
                                    <div class="repair-title"></div>
                                    <div class="repair-description"></div>
                                </div>
                            </div>
                            <div class="repair-footer">
                                <div class="repair-date"><span></span></div>
                                <div class="repair-price"><span></span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="card">
                        <h2 class="card-title">Активные заявки на ремонт</h2>
                        <div id="active-requests-container"></div>
                    </div>

                    <div class="card">
                        <div class="messages-header">
                            <h2 class="card-title messages-title">Последние сообщения</h2>
                        </div>
                        <div id="recent-messages-container">
                            <p>Загрузка...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/customer_dashboard.js"></script>
</body>
</html>
