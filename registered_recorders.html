<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои зарегистрированные регистраторы</title>
    <link rel="stylesheet" href="css/registered_recorders.css">
</head>
<body>
    <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </symbol>
    </svg>

    <input type="checkbox" id="modal-toggle" class="modal-checkbox">

    <div class="container">
        <button class="back-button">
            <svg class="icon">
                <use href="#icon-back"/>
            </svg>
            <span>Назад</span>
        </button>

        <div class="header">
            <h1>Зарегистрированные регистраторы</h1>
            <p>Мои зарегистрированные регистраторы</p>
        </div>

        <div class="add-button-container">
            <label for="modal-toggle" class="add-button">
                <span class="plus">+</span>
                Добавить новый регистратор
            </label>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Модель устройства</th>
                        <th>Серийный номер</th>
                        <th>Организация</th>
                        <th>Дата добавления</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Добавить новый регистратор</h2>
                <label for="modal-toggle" class="close-button">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </label>
            </div>
            <form action="#" method="post">
                <div class="modal-body">
                    <label for="serialNumber" class="form-label">
                        Введите серийный номер
                    </label>
                    <input
                        type="text"
                        id="serialNumber"
                        name="serialNumber"
                        class="form-input"
                        placeholder="например, DL200-2024-A3F71"
                        required
                    />
                    <p class="form-help">
                        Вы можете найти серийный номер на этикетке устройства или в технической документации.
                    </p>
                </div>
                <div class="modal-footer">
                    <label for="modal-toggle" class="cancel-button">
                        Отмена
                    </label>
                    <button type="submit" class="register-button">
                        Зарегистрировать
                    </button>
                </div>
            </form>
        </div>
        <label for="modal-toggle" class="modal-overlay-close"></label>
    </div>

    <div id="customAlert" class="custom-modal hidden">
        <div class="custom-modal-content">
            <div class="custom-modal-header">
                <h3 id="alertTitle">Уведомление</h3>
                <button class="custom-modal-close" id="alertClose">&times;</button>
            </div>
            <div class="custom-modal-body">
                <p id="alertMessage"></p>
            </div>
            <div class="custom-modal-footer">
                <button id="alertOk" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="js/registered_recorders.js"></script>
</body>
</html>
