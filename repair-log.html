<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История ремонтов устройства</title>
    <link rel="stylesheet" href="css/repair-log.css">
</head>
<body>
    <div id="preloader" class="preloader hidden">
    <div class="spinner"></div>
</div>
    <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </symbol>
        <symbol id="icon-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
        </symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" y2="6"/>
            <line x1="8" x2="8" y1="2" y2="6"/>
            <line x1="3" x2="21" y1="10" y2="10"/>
        </symbol>
    </svg>

    <div class="container">
        <div class="header">
            <button class="back-button">
                <svg class="icon">
                    <use href="#icon-back"/>
                </svg>
                <span>Назад</span>
            </button>
            
            <h1>
                <span class="device-name"></span>
                <span class="serial"></span>
                <span style="display: none;">Загрузка...</span>
            </h1>
        </div>

        <div class="timeline">
            <div class="timeline-line"></div>
            <div class="timeline-items" id="timelineItems">
            </div>
        </div>
    </div>

    <script src="js/repair-log.js"></script>
</body>
</html>
