<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в портал обслуживания регистраторов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }

        .sub {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            background-color: #2563eb;
            color: white;
            border: none;
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #1d4ed8;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 12px;
            text-align: left;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Вход в систему</h1>
        <div class="sub">Портал обслуживания промышленных регистраторов</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email" required>
            </div>
            <div class="error-message" id="errorMsg"></div>
            <button type="submit" class="btn-login" id="loginBtn">Войти</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const errorMsgDiv = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        async function handleLogin(e) {
    e.preventDefault();
    errorMsgDiv.classList.remove('show');
    const email = emailInput.value.trim();

    if (!email) {
        errorMsgDiv.textContent = 'Введите email';
        errorMsgDiv.classList.add('show');
        return;
    }

    const originalBtnText = loginBtn.innerHTML;
    loginBtn.disabled = true;
    loginBtn.innerHTML = 'Вход <span class="loader"></span>';

    try {
        const response = await fetch('http://localhost:3000/users');
        if (!response.ok) throw new Error('Сервер недоступен');
        const users = await response.json();

        const user = users.find(u => u.email === email);
        if (!user) {
            throw new Error('Пользователь с таким email не найден');
        }
        if (user.status !== 'active') {
            throw new Error('Учётная запись заблокирована. Обратитесь к администратору.');
        }

        const role = user.role;
        const username = user.username;
        const company = user.company || '';

        sessionStorage.setItem('userRole', role);
        sessionStorage.setItem('username', username);
        sessionStorage.setItem('company', company);
        sessionStorage.setItem('userEmail', email);

        window.location.href = 'customer_dashboard.html';
    } catch (err) {
        errorMsgDiv.textContent = err.message || 'Ошибка входа';
        errorMsgDiv.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.innerHTML = originalBtnText;
    }
}

        form.addEventListener('submit', handleLogin);
    </script>
</body>
</html>
